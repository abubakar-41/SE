<style>
  :root{

  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);
    box-shadow:0 1px 8px rgba(0,0,0,.04)}
  .bar{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:15px;line-height:1.25;flex:1 1 220px}
  .brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .score{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill{border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
  .pill.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
  .pill.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
  .pill.main{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:14px}
  .progress{height:4px;background:var(--line)}
  .progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
  main{max-width:860px;margin:0 auto;padding:18px 16px 40px}
  .pagehead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
  .pagehead h1{font-size:20px;margin:0}
  .pagehead span{color:var(--muted);font-size:14px}
  .sec{margin:22px 0 10px;padding:10px 14px;border-left:4px solid var(--accent);background:var(--card);
    border-radius:6px;font-weight:700;font-size:15px}
  .sec small{display:block;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
  .q p{margin:0 0 10px;font-weight:600}
  .q p b{color:var(--accent);margin-right:6px}
  .opts{display:grid;gap:8px}
  .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;cursor:pointer;
    font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;
    transition:background .15s,border-color .15s}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--bg)}
  .opt:disabled{cursor:default}
  .opt .k{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;
    background:var(--bg);border:1px solid var(--line)}
  .opt .t{flex:1;overflow-wrap:anywhere}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .k{background:var(--ok);color:#fff;border-color:var(--ok)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
  .opt.dim{opacity:.6}
  .star{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;
    vertical-align:2px;background:#fff4d6;color:#a16207;white-space:nowrap}
  @media (prefers-color-scheme: dark){ .star{background:#3a2e0f;color:#facc15} }
  .verdict{margin-top:8px;font-size:13px;font-weight:600}
  .verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
  .pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:26px 0 8px;flex-wrap:wrap}
  .btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:8px;padding:10px 18px;cursor:pointer}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .btn:disabled{opacity:.4;cursor:default}
  .nums{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .num{font:inherit;font-size:13px;min-width:34px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);cursor:pointer}
  .num.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .num.done{border-color:var(--ok)}
  .tools{text-align:center;margin-top:18px}
  .link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 30px}
  @media (max-width:560px){ .bar{padding:8px 12px;gap:6px} .brand{flex-basis:100%;font-size:14px} .brand small{display:none} .pill{font-size:12px;padding:4px 9px} .pill.main{font-size:13px} .pager .btn{flex:1} .nums{order:3;width:100%} }
</style>
</head>

const DATA = {"sections":[{"n":1,"l":"Lecture 1","t":"Introduction to Software Engineering"},{"n":2,"l":"Lecture 2","t":"Background and Fundamental Concepts"},{"n":3,"l":"Week 3","t":"Software Process Models"},{"n":4,"l":"Week 4","t":"RAD, Extreme Programming and Agile Methods"},{"n":5,"l":"Week 5","t":"Spiral, WIN-WIN and the Rational Unified Process (RUP)"},{"n":6,"l":"Week 6","t":"Requirements Engineering, Feasibility and Traceability"},{"n":7,"l":"Week 7","t":"Specifications, V-Model and Systems Evolution"}],"questions":[{"n":1,"s":1,"q":"Software is a combination of which three items?","o":["Program, hardware and network","Program, data and documentation","Code, compiler and user","Data, hardware and documentation"],"a":1,"h":true},{"n":2,"s":1,"q":"Which of the following is NOT considered part of software?","o":["Documentation","Data","Hardware","Program"],"a":2,"h":false},{"n":3,"s":1,"q":"The data on which a program operates is considered:","o":["Separate from the software","Part of the hardware","Only a type of documentation","Part of the software"],"a":3,"h":false},{"n":4,"s":1,"q":"Which defence examples were given in the lecture to show the importance of software?","o":["Al-Khalid tank and Shaheen missile","JF-17 Thunder and Ghauri missile","F-16 and Tomahawk missile","Babur and Nasr missile"],"a":1,"h":false},{"n":5,"s":1,"q":"The process of DNA decoding is only possible with the use of software systems in which field?","o":["Astronomy","Bioinformatics","Embedded systems","Game development"],"a":1,"h":false},{"n":6,"s":1,"q":"Which of the following is listed as a common problem in software development?","o":["More time and cost than expected","Hardware becomes too cheap","Customers never change requirements","Too few errors in the product"],"a":0,"h":false},{"n":7,"s":1,"q":"The Ariane 5 Flight 501 failure was caused by:","o":["A fuel leak in the engine","Bad weather conditions","A hardware wiring fault","Design errors in the software"],"a":3,"h":true},{"n":8,"s":1,"q":"Ariane 5 is a heavy-lift launch vehicle operated by Arianespace for which agency?","o":["NASA","ISRO","SUPARCO","European Space Agency (ESA)"],"a":3,"h":false},{"n":9,"s":1,"q":"\"It is not enough to do your best: you must know what to do, and then do your best.\" Who said this?","o":["Albert Einstein","Fred Brooks","W. Edwards Deming","Roger Pressman"],"a":2,"h":true},{"n":10,"s":1,"q":"\"A clever person solves a problem. A wise person avoids it.\" Who said this?","o":["Albert Einstein","W. Edwards Deming","Ian Sommerville","Barry Boehm"],"a":0,"h":false},{"n":11,"s":1,"q":"The IEEE definition of Software Engineering was given in which year?","o":["1983","1993","2001","1970"],"a":1,"h":true},{"n":12,"s":1,"q":"According to the IEEE definition, software engineering is a ___ approach to development, operation and maintenance of software.","o":["Systematic, disciplined, quantifiable","Fast, cheap, flexible","Creative, informal, rapid","Manual, optional, flexible"],"a":0,"h":true},{"n":13,"s":1,"q":"A finite set of step-by-step instructions to solve a problem (e.g., Bubble Sort) is called:","o":["Software","An algorithm","Software engineering","A database"],"a":1,"h":true},{"n":14,"s":1,"q":"Which of the following is a characteristic of Software Engineering?","o":["It focuses only on writing code quickly","It ignores teamwork","It covers the entire lifecycle: design, development, testing and maintenance","It covers only the testing phase"],"a":2,"h":false},{"n":15,"s":1,"q":"The core focus of Software Engineering, as given in the lecture, is:","o":["Speed and low price only","Scalability and reliability","Hardware design","Graphic design"],"a":1,"h":false},{"n":16,"s":1,"q":"Programming (coding) is best described as:","o":["The whole lifecycle of software","Gathering requirements from clients","Translating logic into computer-executable instructions","Managing software projects"],"a":2,"h":true},{"n":17,"s":1,"q":"Which activity belongs to the scope of Software Engineering but is NOT just programming?","o":["Typing code in an editor","Debugging one single line","Installing a compiler","Verification, validation and maintenance"],"a":3,"h":false},{"n":18,"s":1,"q":"Software Engineering is called \"engineering\" because:","o":["It only deals with machines","It is taught in engineering colleges only","It follows principles and practices derived from conventional engineering disciplines","It needs heavy hardware tools"],"a":2,"h":false},{"n":19,"s":1,"q":"In the objective of software engineering, \"Reliable\" software means that it:","o":["Is delivered on the established date","Has good documentation","Is very cheap","Does not crash"],"a":3,"h":true},{"n":20,"s":1,"q":"In the objective of software engineering, \"On time\" software means that it:","o":["Does not crash","Is delivered at the established date","Has complete documentation","Runs very fast"],"a":1,"h":false},{"n":21,"s":1,"q":"In the objective of software engineering, \"Complete\" software means that it has:","o":["No bugs at all","Only the core features","Good documentation and fulfils customer needs","Source code only"],"a":2,"h":false},{"n":22,"s":1,"q":"Who is the author of \"Software Engineering: A Practitioner's Approach\"?","o":["Ian Sommerville","Fred Brooks","Kent Beck","Roger S. Pressman"],"a":3,"h":false},{"n":23,"s":1,"q":"In embedded systems, products of daily use are:","o":["Built without any software","Controlled only manually","Used only in defence","Controlled through software"],"a":3,"h":false},{"n":24,"s":1,"q":"Which of the following is a stated objective of the Software Engineering course?","o":["To learn only the C++ language","To learn hardware repair","To develop skills to construct high quality, reliable and maintainable software","To learn only database design"],"a":2,"h":false},{"n":25,"s":2,"q":"Engineering is the process of:","o":["Only designing buildings","Only repairing machines","Productively utilizing scientific knowledge to build products","Only writing documents"],"a":2,"h":true},{"n":26,"s":2,"q":"The relation of Computer Science with Software Engineering is similar to the relation of Physics with:","o":["Biology and chemistry","Electrical, mechanical and civil engineering","Business and accounting","Art and design"],"a":1,"h":true},{"n":27,"s":2,"q":"Software engineering can be defined as the process of:","o":["Only learning programming languages","Utilizing our knowledge of computer science in effective production of software systems","Building computer hardware","Only testing software"],"a":1,"h":false},{"n":28,"s":2,"q":"The major thing that distinguishes a software system from other systems is that:","o":["Software is always cheaper","Software does not wear out","Software never changes","Software has no users"],"a":1,"h":true},{"n":29,"s":2,"q":"Which of the following is affected by wear and tear?","o":["A software system","An electric bulb","An algorithm","Source code"],"a":1,"h":false},{"n":30,"s":2,"q":"Changes in the products of non-software systems are generally:","o":["Of fundamental nature","Constant and drastic","Of very minor nature","Made in many dimensions"],"a":2,"h":false},{"n":31,"s":2,"q":"The major reason for complexity in software is:","o":["Its constant process of change and evolution","Its physical size","Its wear and tear","Its high price"],"a":0,"h":true},{"n":32,"s":2,"q":"Change in software has a direct impact on it in the form of:","o":["Wear","Hardware faults","Defects","Lower cost"],"a":2,"h":false},{"n":33,"s":2,"q":"The software crisis occurred in which decade?","o":["1980s","1990s","1960s","2000s"],"a":2,"h":false},{"n":34,"s":2,"q":"What was the main cause of the software crisis?","o":["Computers became too slow","There were too many programmers","Techniques used for small software were not applicable to large, complex software","Software was too cheap"],"a":2,"h":true},{"n":35,"s":2,"q":"Which of the following was NOT a consequence of the software crisis?","o":["Projects were delivered early","Projects were over-budget","Software was delivered too late","Systems were not reliable"],"a":0,"h":false},{"n":36,"s":2,"q":"The term \"Software Engineering\" was coined at a conference held during:","o":["The Y2K problem","The invention of the internet","The invention of the transistor","The software crisis"],"a":3,"h":false},{"n":37,"s":2,"q":"An important result of the software crisis was the realization that:","o":["Hardware is more important","Just coding is not enough","Documentation is useless","Testing is not needed"],"a":1,"h":false},{"n":38,"s":2,"q":"Which of the following is a characteristic of well-engineered software?","o":["It has no documentation","It ignores the user interface","It is reliable, maintainable and cost-effective","It needs unlimited resources"],"a":2,"h":false},{"n":39,"s":2,"q":"Software Engineering is actually a:","o":["Balancing act","Guessing game","Hardware activity","One-time activity"],"a":0,"h":true},{"n":40,"s":2,"q":"Making software more cost-effective may affect its:","o":["Reliability","Syntax","Programming language","File size only"],"a":0,"h":false},{"n":41,"s":2,"q":"Making software more user-friendly may reduce its:","o":["Documentation","Team size","Source code","Efficiency"],"a":3,"h":false},{"n":42,"s":2,"q":"For a cruise missile or nuclear reactor controller, which characteristics are far more important?","o":["Cost-effectiveness and user-friendliness","Performance and reliability","Colour and layout","Low price and portability"],"a":1,"h":true},{"n":43,"s":2,"q":"Software Productivity Research was developed by:","o":["Fred Brooks","Kent Beck","Winston Royce","Capers Jones"],"a":3,"h":false},{"n":44,"s":2,"q":"According to the lecture, coding is not more than about ___ of the whole software development effort.","o":["50%","70%","13 to 14%","90%"],"a":2,"h":true},{"n":45,"s":2,"q":"The article \"No Silver Bullet\" was written by:","o":["Barry Boehm","Fred Brooks","Ian Sommerville","James Martin"],"a":1,"h":true},{"n":46,"s":2,"q":"In \"No Silver Bullet\", an unsophisticated manager sees software as a:","o":["Machine","Giant","Bird","Tree"],"a":1,"h":false},{"n":47,"s":2,"q":"According to Fred Brooks, the only solution to defeat the \"giant\" of software problems is:","o":["A disciplined and engineered approach","A magical tool","More programmers","Faster computers"],"a":0,"h":true},{"n":48,"s":2,"q":"According to Fred Brooks, magic solutions to software problems:","o":["Exist in new languages","Do not exist","Exist in new hardware","Exist in big teams"],"a":1,"h":false},{"n":49,"s":2,"q":"Software Engineering is the combination of:","o":["Only programming languages","All tools, techniques and processes used in software production","Only testing tools","Only hardware components"],"a":1,"h":false},{"n":50,"s":2,"q":"The major challenge for a software engineer is to build software:","o":["Within limited time and budget, cost-effectively and with good quality","With unlimited resources","Without any user","Without any testing"],"a":0,"h":false},{"n":51,"s":3,"q":"A software process is:","o":["A single programming task","A type of hardware","Only the testing phase","A structured set of activities required to develop a software system"],"a":3,"h":true},{"n":52,"s":3,"q":"Which are the four fundamental activities of a software process (Sommerville)?","o":["Coding, compiling, running, printing","Planning, buying, selling, supporting","Specification, design and development, validation, evolution","Analysis, marketing, coding, deleting"],"a":2,"h":true},{"n":53,"s":3,"q":"Which fundamental activity answers the question \"What should the system do?\"","o":["Validation","Evolution","Specification","Design and development"],"a":2,"h":false},{"n":54,"s":3,"q":"Which fundamental activity answers the question \"Does it do what the customer wants?\"","o":["Validation","Specification","Evolution","Design and development"],"a":0,"h":false},{"n":55,"s":3,"q":"Which fundamental activity means \"Change it as needs change\"?","o":["Specification","Evolution","Validation","Design"],"a":1,"h":false},{"n":56,"s":3,"q":"A software process model is:","o":["A particular way of ordering and overlapping the same basic activities","A set of different activities for every project","A programming language","A testing tool"],"a":0,"h":false},{"n":57,"s":3,"q":"The correct order of the core software activities is:","o":["Coding, requirements, design, testing, maintenance, deployment","Design, requirements, testing, coding, deployment, maintenance","Requirements, design, coding, testing, deployment, maintenance","Requirements, coding, design, deployment, testing, maintenance"],"a":2,"h":true},{"n":58,"s":3,"q":"The output (work product) of the Requirements activity is:","o":["Source code","Test report","SRS document","Release build"],"a":2,"h":true},{"n":59,"s":3,"q":"SRS stands for:","o":["System Reliability Standard","Software Release Schedule","Software Requirements Specification","Structured Requirements System"],"a":2,"h":false},{"n":60,"s":3,"q":"The work product of the Deployment activity is:","o":["Release build","Design document","Test report","SRS document"],"a":0,"h":false},{"n":61,"s":3,"q":"Which arrows in the sequence of activities might need to point backwards?","o":["Requirements back to deployment","Deployment back to coding only","Testing back to coding or design, and maintenance back to requirements","None, all arrows are fixed"],"a":2,"h":false},{"n":62,"s":3,"q":"The Waterfall model was introduced by:","o":["Boehm (1986)","Royce (1970)","Kent Beck (1999)","James Martin (1991)"],"a":1,"h":true},{"n":63,"s":3,"q":"In the Waterfall model:","o":["All phases run together","The customer is involved in every step","One phase is done at a time, with no overlap","The prototype is always thrown away"],"a":2,"h":true},{"n":64,"s":3,"q":"In the Waterfall model, going back to an earlier phase requires:","o":["No permission at all","Starting the project again","A new customer","A formal change request"],"a":3,"h":false},{"n":65,"s":3,"q":"Waterfall works well when:","o":["Requirements are stable and well understood","Requirements change frequently","The customer cannot explain needs","The technology is unknown"],"a":0,"h":true},{"n":66,"s":3,"q":"Waterfall struggles when:","o":["The project is regulated","Requirements change and the customer sees the product only at the end","Milestones and documents are required","The domain is familiar"],"a":1,"h":false},{"n":67,"s":3,"q":"Which project best suits the Waterfall model?","o":["Pacemaker firmware with a fixed specification approved by a regulator","A food-delivery startup app with unknown features","A university portal where the client says \"I'll know it when I see it\"","A student game prototype"],"a":0,"h":true},{"n":68,"s":3,"q":"Which project best suits an evolutionary model?","o":["Pacemaker firmware","A payroll tax module with legal rules","A food-delivery startup app where features are unknown until users try it","A government payroll with fixed rules"],"a":2,"h":true},{"n":69,"s":3,"q":"A payroll tax module with rules set by law and vendor contract milestones is best suited to:","o":["Evolutionary","Throwaway prototyping","Exploratory development","Waterfall"],"a":3,"h":false},{"n":70,"s":3,"q":"A client says \"I'll know it when I see it\". Which model fits best?","o":["Evolutionary / exploratory","Waterfall","Big-bang delivery","No model is needed"],"a":0,"h":false},{"n":71,"s":3,"q":"The commonly cited cost of fixing a defect after release compared to fixing it in requirements is about:","o":["2 times","Equal","10 times less","100 times"],"a":3,"h":true},{"n":72,"s":3,"q":"The evolutionary model follows which cycle?","o":["Plan, build, test, never repeat","Design, code, discard","Test, deploy, stop","Build, demo, feedback, refine, repeat"],"a":3,"h":false},{"n":73,"s":3,"q":"Which of the following belong to the evolutionary family of models?","o":["Waterfall and V-Model","Only Waterfall","Only RAD","Prototyping, incremental delivery and spiral"],"a":3,"h":false},{"n":74,"s":3,"q":"The Spiral model was proposed by:","o":["Royce (1970)","Kruchten","Boehm (1986)","Kent Beck"],"a":2,"h":true},{"n":75,"s":3,"q":"The distinctive feature of the Spiral model is:","o":["Explicit risk analysis before committing to the next cycle","Heavy documentation","No customer involvement","A single long phase"],"a":0,"h":true},{"n":76,"s":3,"q":"Customer involvement in Waterfall happens:","o":["At the start and the end","Throughout the project","Never","Only during testing"],"a":0,"h":false},{"n":77,"s":3,"q":"In the Waterfall model, working software is available:","o":["Only at the end","Early and often","After every week","After every meeting"],"a":0,"h":false},{"n":78,"s":3,"q":"Exploratory development means:","o":["Freezing requirements first","Always discarding the prototype","Working with the customer to discover requirements","Coding without a customer"],"a":2,"h":true},{"n":79,"s":3,"q":"Which statement is correct?","o":["Exploratory starts with what you understand least; throwaway starts with what you understand best","Both start with what you understand least","Exploratory starts with what you understand best; throwaway starts with what you understand least","Both start with what you understand best"],"a":2,"h":true},{"n":80,"s":3,"q":"In throwaway prototyping, the prototype is:","o":["Evolved into the final system","Discarded and then the real system is built","Delivered to the customer as it is","Never built"],"a":1,"h":true},{"n":81,"s":3,"q":"Exploratory development is suitable for:","o":["Large safety-critical systems","Small to medium systems with fuzzy requirements","Systems with frozen specifications","Hardware-only products"],"a":1,"h":false},{"n":82,"s":3,"q":"In the prototype fidelity ladder, the correct order from least to most effort is:","o":["Working prototype, mockup, wireframe, paper sketch","Paper sketch, wireframe, clickable mockup, working prototype","Wireframe, paper sketch, working prototype, mockup","Clickable mockup, paper sketch, wireframe, working prototype"],"a":1,"h":true},{"n":83,"s":3,"q":"Low-fidelity prototypes are preferred at the start because they are:","o":["Very realistic","Costly but accurate","Final products","Cheap to change and invite honest feedback"],"a":3,"h":false},{"n":84,"s":3,"q":"Figma and Axure RP are best for:","o":["Sketching ideas in minutes with pen and paper","Testing user flows with clickable UI","Building low-code business apps","Writing the backend code"],"a":1,"h":false},{"n":85,"s":3,"q":"Power Apps and Bubble are examples of:","o":["Paper sketching tools","Low-code / no-code tools","Wireframe tools","Testing tools"],"a":1,"h":false},{"n":86,"s":3,"q":"The cheapest way to test a screen layout with a client is:","o":["Building a Flutter app","Writing the full backend first","Deploying the final system","A paper sketch or Balsamiq wireframe"],"a":3,"h":true},{"n":87,"s":3,"q":"Which of the following is a pitfall of exploratory models?","o":["Structure decays after many quick changes and a throwaway prototype may become the product","Too much documentation","The customer is never involved","It cannot be used for small systems"],"a":0,"h":true},{"n":88,"s":3,"q":"Compared with Waterfall, in evolutionary models risk is generally discovered:","o":["Late","Never","Early","Only after release"],"a":2,"h":false},{"n":89,"s":3,"q":"In the Waterfall vs Evolutionary comparison, documentation in Waterfall is:","o":["Lighter and evolving","Not needed","Heavy","Only verbal"],"a":2,"h":false},{"n":90,"s":3,"q":"In the Waterfall model, each phase ends with:","o":["A signed-off document","A customer demo","A new prototype","A pair programming session"],"a":0,"h":false},{"n":91,"s":4,"q":"RAD was popularised by:","o":["Kent Beck in 1999","Barry Boehm in 1986","Winston Royce in 1970","James Martin around 1991"],"a":3,"h":false},{"n":92,"s":4,"q":"The commonly quoted time target for a RAD system is about:","o":["60 to 90 days","12 to 18 months","5 years","1 to 2 weeks"],"a":0,"h":true},{"n":93,"s":4,"q":"Which are the three pillars of RAD?","o":["Heavy documents, fixed scope and late testing","Reusable components, user involvement and prototyping","Waterfall, V-Model and spiral","Pair programming, TDD and refactoring"],"a":1,"h":false},{"n":94,"s":4,"q":"The four phases of RAD are:","o":["Requirements planning, user design, construction, cutover","Inception, elaboration, construction, transition","Planning, risk analysis, engineering, evaluation","Red, green, refactor, release"],"a":0,"h":true},{"n":95,"s":4,"q":"The heart of RAD is the loop between:","o":["Requirements planning and cutover","User design and construction","Cutover and maintenance","Testing and deployment"],"a":1,"h":false},{"n":96,"s":4,"q":"The cutover phase of RAD covers:","o":["Writing user stories","Pair programming","Risk analysis","Data conversion, acceptance testing, training and go-live"],"a":3,"h":false},{"n":97,"s":4,"q":"In time-boxing, which of the following is flexible?","o":["Time","Cost","Deadline","Scope"],"a":3,"h":true},{"n":98,"s":4,"q":"In time-boxing, the rule is that:","o":["The deadline never moves, features do","Features never move, deadline does","Both time and scope are fixed","Cost is flexible"],"a":0,"h":false},{"n":99,"s":4,"q":"JAD workshops put together:","o":["Only developers","Only managers","Users, analysts, developers and a facilitator","Only testers"],"a":2,"h":false},{"n":100,"s":4,"q":"DSDM stands for:","o":["Dynamic Systems Development Method","Direct Software Design Model","Dynamic Software Development Module","Distributed Systems Delivery Method"],"a":0,"h":false},{"n":101,"s":4,"q":"Which DSDM principle says you must not trade away quality to hit the date?","o":["Deliver on time","Collaborate","Never compromise quality","Demonstrate control"],"a":2,"h":true},{"n":102, er","The Scrum Master","The manager","The customer"],"a":3,"h":false},{"n":124,"s":4,"q":"An XP delivery cycle produces a small release every:","o":["6 months","1 to 2 weeks","1 year","3 years"],"a":1,"h":false},{"n":125,"s":4,"q":"In Scrum, who decides what to build and in what order?","o":["Scrum Master","Product Owner","Developers","Tester"],"a":1,"h":true},{"n":126,"s":4,"q":"In Scrum, who coaches the process and removes blockers?","o":["Product Owner","Customer","Manager","Scrum Master"],"a":3,"h":false},{"n":127,"s":4,"q":"The Daily Scrum is a:","o":["1-hour review","15-minute sync","Weekly planning","Monthly audit"],"a":1,"h":false},{"n":128,"s":4,"q":"Scrum is best described as:","o":["A programming language","A testing tool","A heavy documented process","A lightweight framework, not a full engineering method"],"a":3,"h":false},{"n":129,"s":4,"q":"The WIP limit is a key idea of which method?","o":["Kanban","Waterfall","RAD","V-Model"],"a":0,"h":true},{"n":130,"s":4,"q":"Which method has no fixed iterations or roles?","o":["Kanban","Scrum","XP","RUP"],"a":0,"h":false},{"n":131,"s":4,"q":"Crystal is a family of agile methods by:","o":["Kent Beck","Ivar Jacobson","Alistair Cockburn","Philippe Kruchten"],"a":2,"h":false},{"n":132,"s":4,"q":"FDD stands for:","o":["Fast Delivery Design","Feature-Driven Development","Fixed Deadline Development","Functional Design Document"],"a":1,"h":false},{"n":133,"s":5,"q":"The WIN-WIN Spiral model was introduced by Boehm in:","o":["1986","1970","1998","2004"],"a":2,"h":true},{"n":134,"s":5,"q":"In the Spiral model, Quadrant 2 is mainly about:","o":["Identifying and resolving risks","Planning the next cycle","Writing final documentation","Determining objectives"],"a":0,"h":true},{"n":135,"s":5,"q":"The Spiral model is called a meta-model because:","o":["It has no cycles","It is the same as Waterfall always","It never uses prototypes","Each cycle chooses the activity that best addresses the dominant risk"],"a":3,"h":true},{"n":136,"s":5,"q":"In the Spiral model, unclear requirements are best handled by:","o":["A Waterfall step","A technical spike","A benchmark simulation","Building a throwaway prototype"],"a":3,"h":false},{"n":137,"s":5,"q":"In the Spiral model, unproven performance is best handled by:","o":["Building and benchmarking a simulation","A throwaway prototype","A conventional Waterfall step","Ignoring it"],"a":0,"h":false},{"n":138,"s":5,"q":"In the Spiral model, unfamiliar technology is best handled by:","o":["A Waterfall step","A small technical spike","Writing documentation","Skipping the cycle"],"a":1,"h":false},{"n":139,"s":5,"q":"In the Spiral model, well-understood and low-risk work can use:","o":["A conventional Waterfall step","A throwaway prototype","A simulation","A negotiation"],"a":0,"h":false},{"n":140,"s":5,"q":"In the Spiral diagram, the radius represents:","o":["Number of developers","Risk only","Time only","Cumulative project cost"],"a":3,"h":false},{"n":141,"s":5,"q":"If risk is not falling while cost keeps climbing in a spiral:","o":["Stop and rethink before spending more","Continue the same way","Increase the budget","Skip testing"],"a":0,"h":true},{"n":142,"s":5,"q":"WIN-WIN Spiral adds which step before objectives are set?","o":["Stakeholder negotiation","Code review","Final testing","Deployment"],"a":0,"h":true},{"n":143,"s":5,"q":"In the WIN-WIN stakeholder example, the customer wants:","o":["Every feature at low cost","Realistic scope","The deadline held","An easy and safe system"],"a":0,"h":false},{"n":144,"s":5,"q":"Which are the three WIN-WIN activities?","o":["Plan, code, test","Inception, elaboration, construction","Red, green, refactor","Identify stakeholders, identify win conditions, negotiate win-win reconciliation"],"a":3,"h":true},{"n":145,"s":5,"q":"WIN-WIN negotiation takes place:","o":["Only once at the start of the project","Only at the end","Before quadrant 1 in every cycle","Only in the last cycle"],"a":2,"h":true},{"n":146,"s":5,"q":"The agreed win-win conditions become the cycle's:","o":["Source code","Test cases","Objectives, constraints and alternatives","Release notes"],"a":2,"h":false},{"n":147,"s":5,"q":"In early spiral cycles, win-win negotiation is usually done with:","o":["All possible stakeholders","The core team","Regulators only","No one"],"a":1,"h":false},{"n":148,"s":5,"q":"The Spiral / WIN-WIN approach is a good fit for:","o":["Very small projects","Projects with frozen requirements","Large, high-risk or high-cost projects","One-day tasks"],"a":2,"h":false},{"n":149,"s":5,"q":"Which is a pitfall of the Spiral model?","o":["It ignores risk","It has no customer involvement","It can spiral literally without firm exit criteria","It needs no skills"],"a":2,"h":false},{"n":150,"s":5,"q":"RUP was developed by Kruchten at:","o":["Microsoft","Google","Rational Software (later IBM)","Oracle"],"a":2,"h":false},{"n":151,"s":5,"q":"RUP was directly influenced by:","o":["The Spiral model","The Waterfall model","XP","Kanban"],"a":0,"h":false},{"n":152,"s":5,"q":"Which list shows the four characteristics of RUP?","o":["Plan-driven, document-driven, tool-driven, time-driven","Fast, cheap, small, simple","Pair-driven, test-driven, code-driven, user-driven","Use-case driven, architecture-centric, iterative and incremental, risk-driven"],"a":3,"h":true},{"n":153,"s":5,"q":"The four phases of RUP are:","o":["Requirements planning, user design, construction, cutover","Specification, design, validation, evolution","Inception, elaboration, construction, transition","Plan, do, check, act"],"a":2,"h":true},{"n":154,"s":5,"q":"The milestone that ends the Inception phase is:","o":["Lifecycle Architecture","Initial Operational Capability","Lifecycle Objective","Product Release"],"a":2,"h":false},{"n":155,"s":5,"q":"The milestone that ends the Elaboration phase is:","o":["Lifecycle Objective","Lifecycle Architecture","Product Release","Initial Operational Capability"],"a":1,"h":true},{"n":156,"s":5,"q":"The milestone that ends the Construction phase is:","o":["Lifecycle Objective","Lifecycle Architecture","Initial Operational Capability","Product Release"],"a":2,"h":false},{"n":157,"s":5,"q":"The milestone that ends the Transition phase is:","o":["Lifecycle Objective","Lifecycle Architecture","Initial Operational Capability","Product Release"],"a":3,"h":false},{"n":158,"s":5,"q":"The Inception phase focuses on:","o":["Beta testing","Building all features","Deployment","Scope, business case and key risks"],"a":3,"h":false},{"n":159,"s":5,"q":"In the Elaboration phase:","o":["The architecture is proven against top risks","The product is released","Only the business case is written","Beta testing is done"],"a":0,"h":false},{"n":160,"s":5,"q":"In RUP, phases are ___ and disciplines are ___.","o":["What kind of work, when","When, what kind of work","Both the same","Tools, people"],"a":1,"h":true},{"n":161,"s":5,"q":"Which of the following is NOT a RUP engineering discipline?","o":["Project management","Business modeling","Requirements","Deployment"],"a":0,"h":false},{"n":162,"s":5,"q":"Which of the following are supporting disciplines of RUP?","o":["Configuration and change management, project management, environment","Requirements, test, deployment","Business modeling, implementation, test","Inception, elaboration, construction"],"a":0,"h":true},{"n":163,"s":5,"q":"RUP has how many disciplines in total?","o":["Nine","Four","Six","Twelve"],"a":0,"h":false},{"n":164,"s":5,"q":"Which list shows RUP best practices (implementation criteria)?","o":["Develop iteratively, manage requirements, use component architecture, model visually, verify quality continuously, control changes","Pair programming, TDD, refactoring, simple design, small releases, metaphor","Plan, design, code, test, deploy, maintain","Must, should, could, won't, time-box, workshop"],"a":0,"h":true},{"n":165,"s":5,"q":"The RUP best practice \"Model visually\" means using:","o":["UML so design is shared, not just coded","Paper sketches only","Photographs","No diagrams"],"a":0,"h":false},{"n":166,"s":5,"q":"The RUP best practice \"Verify quality continuously\" means:","o":["Test every iteration, not only at the end","Test only at the end","Never test","Test only after release"],"a":0,"h":false},{"n":167,"s":5,"q":"In the RUP hump chart, requirements work:","o":["Peaks only in Transition","Is absent in Construction","Happens only at the end","Peaks in Inception and Elaboration"],"a":3,"h":false},{"n":168,"s":5,"q":"A team builds a throwaway spike to prove the chosen database can handle the load. Which RUP phase is this?","o":["Inception","Transition","Elaboration","Construction"],"a":2,"h":false},{"n":169,"s":5,"q":"A product is demoed to early customers and field bugs are triaged. Which RUP phase is this?","o":["Inception","Transition","Elaboration","Construction"],"a":1,"h":false},{"n":170,"s":5,"q":"A change request is logged, assessed and scheduled instead of just being coded. Which RUP practice is shown?","o":["Model visually","Control changes","Develop iteratively","Use component architecture"],"a":1,"h":false},{"n":171,"s":5,"q":"Compared with RUP, the Spiral model is:","o":["A detailed documented process with nine disciplines","A risk-driven meta-model with open-ended loops","A set of four fixed phases","A testing method"],"a":1,"h":false},{"n":172,"s":5,"q":"RUP is best known for:","o":["Having no documents","Having no phases","Traceability and tool support","Being the fastest method"],"a":2,"h":true},{"n":173,"s":6,"q":"Requirements engineering is the process of:","o":["Writing code for a system","Testing the final product","Discovering, analysing, documenting and checking the services a system must provide and its constraints","Maintaining hardware"],"a":2,"h":true},{"n":174,"s":6,"q":"The four core activities of requirements engineering are:","o":["Design, code, test, deploy","Discover, analyse and negotiate, specify, validate","Plan, build, run, stop","Buy, sell, install, repair"],"a":1,"h":true},{"n":175,"s":6,"q":"A \"requirement\" is:","o":["A line of code","A test report","A description of a system service or constraint","A project budget"],"a":2,"h":false},{"n":176,"s":6,"q":"Which is the correct order of the RE process boxes?","o":["Specification, feasibility study, validation, elicitation","Validation, specification, feasibility, elicitation","Elicitation, validation, feasibility, specification","Feasibility study, elicitation and analysis, specification, validation"],"a":3,"h":true},{"n":177,"s":6,"q":"In the RE process cycle, which box is at the centre?","o":["Feasibility study","Validation","Specification","Change management"],"a":3,"h":false},{"n":178,"s":6,"q":"In many studies, about what percentage of defects trace back to poor or missing requirements?","o":["5%","95%","0%","45%"],"a":3,"h":false},{"n":179,"s":6,"q":"A feasibility study is mainly meant to be:","o":["Long and highly detailed","A full requirements document","Done after coding starts","Short, cheap and fast"],"a":3,"h":true},{"n":180,"s":6,"q":"Which is one of the three classic feasibility questions?","o":["How many lines of code will it have?","Which colour should the UI be?","Does it support the business objectives?","Who will test it?"],"a":2,"h":false},{"n":181,"s":6,"q":"A feasibility study typically takes:","o":["A few weeks and ends with a short recommendation report","Several years","A few minutes","As long as the whole project"],"a":0,"h":false},{"n":182,"s":6,"q":"The TELOS checklist stands for:","o":["Time, Effort, Logic, Output, Scope","Test, Evaluate, Launch, Observe, Support","Technical, Ethical, Legal, Organisational, Social","Technical, Economic, Legal, Operational, Scheduling"],"a":3,"h":true},{"n":183,"s":6,"q":"Checking whether a new law affects the project is which type of feasibility?","o":["Legal","Technical","Economic","Scheduling"],"a":0,"h":true},{"n":184,"s":6,"q":"\"Will staff actually use this system day to day?\" tests:","o":["Technical feasibility","Legal feasibility","Scheduling feasibility","Operational feasibility"],"a":3,"h":true},{"n":185,"s":6,"q":"The main output of a feasibility study is:","o":["Source code","A go / no-go recommendation","A UML diagram","A test plan"],"a":1,"h":true},{"n":186,"s":6,"q":"A feasibility study is designed to:","o":["Fail late and costly","Fail fast and cheap if the project is not workable","Never fail","Replace the requirements phase"],"a":1,"h":false},{"n":187,"s":6,"q":"\"Do the benefits outweigh the cost?\" is a question of:","o":["Technical feasibility","Legal feasibility","Economic feasibility","Operational feasibility"],"a":2,"h":false},{"n":188,"s":6,"q":"\"Can our technology and skills actually do this?\" is a question of:","o":["Economic feasibility","Operational feasibility","Scheduling feasibility","Technical feasibility"],"a":3,"h":false},{"n":189,"s":6,"q":"\"Can it be delivered in time to matter?\" is a question of:","o":["Legal feasibility","Scheduling feasibility","Technical feasibility","Economic feasibility"],"a":1,"h":false},{"n":190,"s":6,"q":"Requirements discovery is also called:","o":["Validation","Verification","Maintenance","Elicitation"],"a":3,"h":false},{"n":191,"s":6,"q":"Why is requirements discovery difficult?","o":["Everyone knows everything","No single person knows all the requirements","Requirements never change","Stakeholders always agree"],"a":1,"h":false},{"n":192,"s":6,"q":"A feasibility study is carried out:","o":["After coding starts","Before full requirements work begins","After deployment","Only during maintenance"],"a":1,"h":false},{"n":193,"s":6,"q":"Which of the following is NOT a requirements discovery technique?","o":["Compiling code","Interviews","Observation","Questionnaires"],"a":0,"h":false},{"n":194,"s":6,"q":"Which technique reaches many people quickly but stays shallow?","o":["Observation","Questionnaires","Interviews","Prototyping"],"a":1,"h":false},{"n":195,"s":6,"q":"Watching users work witho ected before changing a requirement\"?","o":["Impact analysis","Coverage check","Audit","Feasibility"],"a":0,"h":false},{"n":205,"s":6,"q":"Which purpose of traceability confirms every requirement actually has a test?","o":["Impact analysis","Scope control","Coverage check","Audit"],"a":2,"h":false},{"n":206,"s":6,"q":"Which purpose of traceability helps spot code or features with no requirement behind them?","o":["Scope control","Coverage check","Impact analysis","Feasibility"],"a":0,"h":false},{"n":207,"s":6,"q":"The traceability matrix example has which columns?","o":["Name, Age, City, Salary","Phase, Cost, Team, Risk","Class, Method, Object, Test","ID, Requirement, Source, Design, Code, Test, Status"],"a":3,"h":false},{"n":208,"s":6,"q":"Forward traceability goes from:","o":["Test to requirement","Code to feasibility","Requirement to design to code to test","Test to deployment"],"a":2,"h":false},{"n":209,"s":6,"q":"Tracing from a test case back to its requirement is:","o":["Forward traceability","A feasibility study","Backward traceability","An interview technique"],"a":2,"h":true},{"n":210,"s":6,"q":"Bidirectional traceability means:","o":["Both forward and backward tracing are kept up to date","Only forward tracing","Only backward tracing","No tracing"],"a":0,"h":false},{"n":211,"s":6,"q":"The main risk of having NO traceability matrix is:","o":["Slower compiling","Too many interviews","Code built with no requirement behind it, unnoticed","Lower server cost"],"a":2,"h":true},{"n":212,"s":6,"q":"Which is the correct traceability chain?","o":["Test case, code, design, need, requirement","Stakeholder need, requirement, design element, code module, test case","Code, design, test, need, requirement","Requirement, test, code, design, need"],"a":1,"h":false},{"n":213,"s":7,"q":"Functional requirements describe:","o":["How well the system must do it","The project budget","The team size","What the system must DO"],"a":3,"h":true},{"n":214,"s":7,"q":"Non-functional requirements describe:","o":["How WELL the system must do it","Only what the system does","The source code","The test cases"],"a":0,"h":true},{"n":215,"s":7,"q":"\"The app must support English and Urdu\" is a:","o":["Functional requirement","Non-functional requirement","Feasibility question","Test case"],"a":0,"h":true},{"n":216,"s":7,"q":"\"Search results must appear in under 1 second\" is:","o":["Non-functional and measurable","Functional and not testable","Non-functional but vague","A use case"],"a":0,"h":true},{"n":217,"s":7,"q":"\"Login must respond within 2 seconds\" is a:","o":["Non-functional requirement","Functional requirement","Test case","Design document"],"a":0,"h":false},{"n":218,"s":7,"q":"\"The system must be available 99.9% of the time\" is a:","o":["Functional requirement","Non-functional requirement","Use case","Feasibility study"],"a":1,"h":false},{"n":219,"s":7,"q":"\"Only staff accounts can view grades\" is a:","o":["Functional (login) requirement","Usability requirement","Portability requirement","Non-functional (security) requirement"],"a":3,"h":false},{"n":220,"s":7,"q":"\"A report can be exported as PDF\" is a:","o":["Functional requirement","Non-functional requirement","Performance requirement","Scalability requirement"],"a":0,"h":false},{"n":221,"s":7,"q":"Good functional requirements are written as:","o":["A clear, testable \"if this, then that\"","Vague statements","Long stories","Source code"],"a":0,"h":false},{"n":222,"s":7,"q":"Which are the three sources of non-functional requirements?","o":["Product, organisational and external","Customer, tester and manager","Design, code and test","Time, cost and scope"],"a":0,"h":true},{"n":223,"s":7,"q":"Every non-functional requirement should be:","o":["Vague","Short only","Optional","Measurable"],"a":3,"h":true},{"n":224,"s":7,"q":"\"The system should be user-friendly\" needs fixing because it is:","o":["Too short","Not a real requirement type","Not measurable","Already perfect"],"a":2,"h":true},{"n":225,"s":7,"q":"\"How easy it is to learn and use\" describes which NFR type?","o":["Usability","Performance","Security","Portability"],"a":0,"h":false},{"n":226,"s":7,"q":"\"Handles growth in users or data\" describes which NFR type?","o":["Availability","Reliability","Scalability","Portability"],"a":2,"h":false},{"n":227,"s":7,"q":"\"How much uptime is guaranteed\" describes which NFR type?","o":["Maintainability","Usability","Availability","Scalability"],"a":2,"h":false},{"n":228,"s":7,"q":"\"How easy it is to change later\" describes which NFR type?","o":["Maintainability","Portability","Performance","Security"],"a":0,"h":false},{"n":229,"s":7,"q":"Security vs usability is an example of:","o":["A functional requirement","A feasibility study","Two NFRs in conflict","A traceability link"],"a":2,"h":true},{"n":230,"s":7,"q":"Which NFR pair conflicts because fast, specialised code is harder to change?","o":["Security vs usability","Portability vs availability","Reliability vs scalability","Performance vs maintainability"],"a":3,"h":false},{"n":231,"s":7,"q":"Generic code that runs everywhere but is not fastest anywhere is a conflict between:","o":["Security and usability","Portability and performance","Performance and maintainability","Reliability and availability"],"a":1,"h":false},{"n":232,"s":7,"q":"\"Are we building the product right?\" describes:","o":["Validation","Maintenance","Feasibility","Verification"],"a":3,"h":true},{"n":233,"s":7,"q":"\"Are we building the right product?\" describes:","o":["Verification","Maintenance","Validation","Feasibility"],"a":2,"h":true},{"n":234,"s":7,"q":"The distinction between verification and validation is credited to:","o":["Lehman","Kruchten","Boehm","Kent Beck"],"a":2,"h":false},{"n":235,"s":7,"q":"In the V-Model, acceptance testing is paired with:","o":["Requirements","Module design","Architecture design","Coding"],"a":0,"h":true},{"n":236,"s":7,"q":"In the V-Model, system testing is paired with:","o":["Requirements","System design","Module design","Coding"],"a":1,"h":false},{"n":237,"s":7,"q":"In the V-Model, integration testing is paired with:","o":["System design","Module design","Requirements","Architecture design"],"a":3,"h":false},{"n":238,"s":7,"q":"In the V-Model, unit testing is paired with:","o":["Architecture design","System design","Requirements","Module design"],"a":3,"h":true},{"n":239,"s":7,"q":"In the V shape, the development and test sides meet at:","o":["Requirements","Deployment","Coding","Maintenance"],"a":2,"h":false},{"n":240,"s":7,"q":"Which is a strength of the V-Model?","o":["It handles changing requirements easily","Testing is planned from day one","It needs very little documentation","Working software appears very early"],"a":1,"h":false},{"n":241,"s":7,"q":"Which is a limitation of the V-Model?","o":["Testing is bolted on at the end","It inherits Waterfall's rigidity","It is bad for safety-critical systems","It has no link from requirement to test"],"a":1,"h":true},{"n":242,"s":7,"q":"The V-Model is essentially:","o":["An agile method","A spiral model","Waterfall with an explicit testing plan mirrored onto it","A RAD framework"],"a":2,"h":false},{"n":243,"s":7,"q":"Most of a system's total cost is spent:","o":["During requirements","After its first release","During design","During coding"],"a":1,"h":true},{"n":244,"s":7,"q":"Lehman's law of \"continuing change\" says that a system that is actually used:","o":["Never changes","Becomes simpler automatically","Improves without work","Must keep changing or become progressively less useful"],"a":3,"h":true},{"n":245,"s":7,"q":"Lehman's law of \"increasing complexity\" says that as a system changes:","o":["Its structure becomes simpler","Its structure becomes more complex unless work is done to simplify it","It becomes cheaper","It gets fewer users"],"a":1,"h":false},{"n":246,"s":7,"q":"Lehman's law of \"declining quality\" says that without active maintenance:","o":["Quality always improves","Perceived quality declines over time","Quality stays the same","Cost declines"],"a":1,"h":false},{"n":247,"s":7,"q":"Fixing a bug found in production is which type of maintenance?","o":["Adaptive","Perfective","Preventive","Corrective"],"a":3,"h":true},{"n":248,"s":7,"q":"Adjusting software to a new OS, device or law is which type of maintenance?","o":["Adaptive","Corrective","Perfective","Preventive"],"a":0,"h":false},{"n":249,"s":7,"q":"Rewriting old, messy code that still works fine (refactoring before it becomes a problem) is:","o":["Corrective maintenance","Adaptive maintenance","A feasibility study","Preventive maintenance"],"a":3,"h":false},{"n":250,"s":7,"q":"A high-value system with poor code quality is usually:","o":["Re-engineered","Scrapped","Replaced immediately","Left completely untouched"],"a":0,"h":true}]};
const PER = 50, Q = DATA.questions, PAGES = Math.ceil(Q.length / PER), KEY = 'se250-v1';
const secTitle = Object.fromEntries(DATA.sections.map(s => [s.n, s.t]));
const secLabel = Object.fromEntries(DATA.sections.map(s => [s.n, s.l]));
let state = { page: 0, ans: {} };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.ans) state = s; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const $ = id => document.getElementById(id);

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function paint(card, q) {
  const pick = state.ans[q.n];
  const btns = card.querySelectorAll('.opt');
  const v = card.querySelector('.verdict');
  if (pick == null) return;
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.a) b.classList.add('correct');
    else if (i === pick) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  v.className = 'verdict ' + (pick === q.a ? 'ok' : 'bad');
  v.textContent = pick === q.a ? 'Correct!' : 'Wrong — correct answer is ' + 'ABCD'[q.a] + '.';
}

function render() {
  const p = state.page, start = p * PER, items = Q.slice(start, start + PER);
  $('title').textContent = 'Page ' + (p + 1) + ' of ' + PAGES;
  $('range').textContent = 'Questions ' + (start + 1) + '–' + (start + items.length);
  const list = $('list'); list.replaceChildren();
  let lastSec = null;
  items.forEach(q => {
    if (q.s !== lastSec) {
      const h = el('div', 'sec'); h.append(el('small', null, secLabel[q.s]), document.createTextNode(secTitle[q.s]));
      list.append(h); lastSec = q.s;
    }
    const card = el('div', 'q'); card.id = 'q' + q.n;
    const p_ = el('p'); p_.append(el('b', null, 'Q' + q.n + '.'), document.createTextNode(q.q));
    if (q.h) p_.append(el('span', 'star', '★ High chance'));
    const opts = el('div', 'opts');
    q.o.forEach((t, i) => {
      const b = el('button', 'opt'); b.type = 'button';
      b.append(el('span', 'k', 'ABCD'[i]), el('span', 't', t));
      b.addEventListener('click', () => {
        if (state.ans[q.n] != null) return;
        state.ans[q.n] = i; save(); paint(card, q); score();
      });
      opts.append(b);
    });
    card.append(p_, opts, el('div', 'verdict'));
    list.append(card); paint(card, q);
  });
  $('prev').disabled = p === 0;
  $('next').disabled = p === PAGES - 1;
  const nums = $('nums'); nums.replaceChildren();
  for (let i = 0; i < PAGES; i++) {
    const b = el('button', 'num' + (i === p ? ' on' : ''), String(i + 1)); b.type = 'button';
    const done = Q.slice(i * PER, i * PER + PER).every(q => state.ans[q.n] != null);
    if (done && i !== p) b.classList.add('done');
    b.addEventListener('click', () => go(i)); nums.append(b);
  }
  score();
}

function score() {
  let ok = 0, bad = 0, pageOk = 0;
  const start = state.page * PER;
  for (const n in state.ans) {
    const q = Q[n - 1], right = state.ans[n] === q.a;
    right ? ok++ : bad++;
    if (right && n > start && n <= start + PER) pageOk++;
  }
  $('sTotal').textContent = 'Score: ' + ok + ' / ' + Q.length;
  $('sOk').textContent = '✔ ' + ok;
  $('sBad').textContent = '✘ ' + bad;
  $('sPage').textContent = 'This page: ' + pageOk + ' / ' + Math.min(PER, Q.length - start);
  $('prog').style.width = ((ok + bad) / Q.length * 100) + '%';
}

function go(p) {
  if (p < 0 || p >= PAGES) return;
  state.page = p; save(); render();
  window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
}
$('prev').onclick = () => go(state.page - 1);
$('next').onclick = () => go(state.page + 1);
$('reset').onclick = () => { if (confirm('Clear all your answers and start again?')) { state = { page: 0, ans: {} }; save(); render(); window.scrollTo(0, 0); } };
render();
</script>
